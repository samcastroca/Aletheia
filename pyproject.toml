[project]
name = "aletheia"
version = "0.1.0"
description = "Taller de videos matemáticos con ManimGX"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = ["manimgx>=0.1.1"]

[dependency-groups]
dev = ["ty"]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

# common/ vive en la raíz del repo, no en src/
[tool.uv.build-backend]
module-name = "common"
module-root = ""
